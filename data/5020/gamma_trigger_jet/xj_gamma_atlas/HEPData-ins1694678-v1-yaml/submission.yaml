data_file: data1.yaml
description: Photon-jet pT balance distributions (1/Ng)(dN/dxJg) in pp events (blue,
  reproduced on all panels) and Pb+Pb events (red) with each panel denoting a different
  centrality selection. These panels show results with pTg = 63.1-79.6 GeV. Total
  systematic uncertainties are shown as boxes, while statistical uncertainties are
  shown with vertical bars.
