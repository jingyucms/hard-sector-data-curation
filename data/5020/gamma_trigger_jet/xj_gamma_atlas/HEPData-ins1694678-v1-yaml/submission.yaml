additional_resources:
- {description: web page with auxiliary material, location: 'http://atlas.web.cern.ch/Atlas/GROUPS/PHYSICS/PAPERS/HION-2018-06/'}
comment: "CERN-LHC.  Measurements of the transverse momentum balance between isolated
  photons and inclusive jets are presented using 0.49 nb^{-1} of Pb+Pb collision data
  at 5.02 TeV and 25 pb^{-1} of pp collision data at 5.02 TeV recorded with the ATLAS
  detector at the LHC. Photons with pT(\u03B3)>63.1 GeV and |eta(\u03B3)|<2.37 are
  paired inclusively with all jets that have pT>31.6GeV and |eta|<2.8 in the event.
  The transverse momentum balance given by the jet-to-photon pT ratio, xJ\u03B3, are
  measured for pairs with azimuthal opening angl dphi > 7pi/8. Distributions of the
  per-photon jet yield (1/N\u03B3)(dN/dxJ\u03B3) are corrected via a two-dimensional
  unfolding procedure for detector effects and reported at the particle level for
  the first time. In pp collisions, the distributions are well described by Monte
  Carlo event generators. In Pb+Pb collisions, the xJ\u03B3 distribution is modified
  with increasing centrality, consistent with the picture of parton-energy loss in
  the hot nuclear medium. The data are compared to a suite of energy loss models and
  calculations.\n"
hepdata_doi: 10.17182/hepdata.85369.v1
