data_file: table_1.yaml
description: |-
  Inclusive subjet $z_r$ in pp collisions for $r=0.1$
  $80<p_{\mathrm{T}}^{\mathrm{ch\;jet}}<120$ GeV/$c$.

  For the "trkeff" and "generator" systematic uncertainty sources, the signed systematic uncertainty breakdowns ($\pm$ vs. $\mp$), denote correlation across bins (both within this table, and across tables). For the remaining sources ("unfolding") no correlation information is specified ($\pm$ is always used).
keywords:
- name: reactions
  values: [P P --> jet+X]
- name: cmenergies
  values: ['5020']
location: Figure 2
name: Table 1
table_doi: 10.17182/hepdata.133562.v1/t1
