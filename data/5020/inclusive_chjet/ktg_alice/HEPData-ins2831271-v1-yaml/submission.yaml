data_file: table_1.yaml
description: |-
  Groomed relative transverse momentum, $k_{\text{T,g}}$, spectra measured in pp collisions.
  $60 < p_{\text{T,ch jet}}^{\text{}} < 80\:\text{GeV}/c$, Dynamical grooming $a = 1.0$

  For the "trk eff" and "generator" systematic uncertainty sources, the signed systematic uncertainty breakdowns ($\pm$ vs. $\mp$) denote correlation across bins. For the remaining sources ("unfold"), no correlation information is specified (i.e. $\pm$ is always used). In the publication, the quadrature sum of all sources of systematic uncertainty is reported, neglecting the sign information reported here.
keywords:
- name: reactions
  values: [P P --> jet+X]
- name: cmenergies
  values: ['5020']
- name: observables
  values: ['Groomed $k_{\text{T,g}}$ spectra']
location: Figure 1 (left)
name: Table 1
table_doi: 10.17182/hepdata.158541.v1/t1
