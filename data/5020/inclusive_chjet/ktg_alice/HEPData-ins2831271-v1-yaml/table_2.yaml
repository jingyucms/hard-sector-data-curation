    - {label: 'sys,trk_eff', symerror: 0.0013}
    - {label: 'sys,gen', symerror: -0.009}
    - {label: 'sys,unfold,bkg,non_closure', symerror: 0.0032}
    value: 0.04
  - errors:
    - {label: stat, symerror: 0.0014}
    - {label: 'sys,trk_eff', symerror: 0.00082}
    - {label: 'sys,gen', symerror: -0.0037}
    - {label: 'sys,unfold,bkg,non_closure', symerror: 0.0015}
    value: 0.0145
