data_file: table_1.yaml
description: |-
  Groomed jet momentum splitting fraction $z_{{\mathrm{g}}}$ in pp collisions.
  $60<p_{\mathrm{T,\;ch\;jet}}<80 \;\mathrm{GeV}/c$, Soft Drop $z_{\mathrm{cut}}=0.2, \beta=0$.

  Note: The first bin corresponds to the Soft Drop untagged fraction.

  For the "trkeff" and "generator" systematic uncertainty sources, the signed systematic uncertainty breakdowns ($\pm$ vs. $\mp$), denote correlation across bins (both within this table, and across tables for a given centrality). For the remaining sources ("unfolding") no correlation information is specified ($\pm$ is always used).
keywords:
- name: reactions
  values: [P P --> jet+X]
- name: cmenergies
  values: ['5020']
location: Figure 2 (left)
name: Table 1
table_doi: 10.17182/hepdata.128137.v1/t1
