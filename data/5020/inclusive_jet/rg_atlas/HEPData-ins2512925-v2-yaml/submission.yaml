additional_resources:
- {description: web page with auxiliary material, location: 'http://atlas.web.cern.ch/Atlas/GROUPS/PHYSICS/PAPERS/'}
comment: "CERN-LHC.  Jet substructure modification and suppression are measured in
  Pb+Pb collisions with respect to pp collisions with the ATLAS detector at the Large
  Hadron Collider. Jets used in this analysis are clustered using the anti-kT algorithm
  with a radius parameter R = 0.4. The jet constituents, defined by both tracking
  and calorimeter information, are used to define the angular scale rg of the first
  hard splitting inside the jet by reclustering them using the Cambridge-Aachen algorithm
  and employing the soft drop grooming technique with parameters \U0001D6FD = 0 and
  \U0001D467cut = 0.2. The jet nuclear modification factor, RAA, used to characterize
  the jet suppression in Pb+Pb collisions, is presented differentially in rg, jet
  transverse momentum, and in intervals of collision centrality. The RAA is observed
  to depend significantly on jet \U0001D45Fg, with the production of jets with the
  largest measured rg found to be twice as suppressed compared to those with the smallest
  rg in central Pb+Pb collisions. The RAA values do not exhibit a strong variation
  with jet pT in any of the rg intervals. The rg and pT dependence of jet RAA is qualitatively
  consistent with a picture of jet quenching arising from coherence and provides the
  most direct evidence in support of this approach.\n"
hepdata_doi: 10.17182/hepdata.132904.v2
