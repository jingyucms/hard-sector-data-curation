data_file: data1.yaml
description: Unfolded jet charge measurements for the $p_{T}$-weighting factor $\kappa
  = 0.5$ and a minimum track $p_{T}$ of 1 GeV for inclusive jets in pp and PbPb data.
  The PbPb results are shown for different centrality regions.
keywords:
- name: reactions
  values: [P P --> CHARGED X, PB PB --> CHARGED X]
- name: observables
  values: ['$\frac{1}{N_{\text{jet}}}\frac{dN}{dQ}$']
- name: phrases
  values: []
- name: cmenergies
  values: [5020.0]
location: Data from top panel of Fig. 1 and top of middle panel in Fig. 6.
name: Table 1
table_doi: 10.17182/hepdata.88294.v1/t1
