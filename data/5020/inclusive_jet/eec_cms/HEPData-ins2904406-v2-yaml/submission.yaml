additional_resources:
- {description: Created with hepdata_lib 0.17.0, location: 'https://doi.org/10.5281/zenodo.1217998'}
- {description: Webpage with all figures and tables, location: 'https://cms-results.web.cern.ch/cms-results/public-results/publications/HIN-23-004'}
- {description: DOI, location: 'https://doi.org/10.1016/j.physletb.2025.139556'}
- {description: arXiv, location: 'https://arxiv.org/abs/2503.19993'}
comment: "Energy-energy correlators are constructed by averaging the number of charged
  particle pairs within jets, weighted by the product of their transverse momenta,
  as a function of the angular separation of the particles within a pair. They are
  sensitive to a multitude of perturbative and nonperturbative quantum chromodynamics
  phenomena in high-energy particle collisions. Using lead-lead data recorded with
  the CMS detector, energy-energy correlators inside high transverse momentum jets
  are measured in heavy ion collisions for the first time. The data are obtained at
  a nucleon-nucleon center-of-mass energy of 5.02\u202FTeV and correspond to an integrated
  luminosity of $1.70\\,\\mathrm{nb}^{-1}$. A similar analysis is done for proton-proton
  collisions at the same center-of-mass energy to establish a reference. The ratio
  of lead-lead to proton-proton energy-energy correlators reveals significant jet
  substructure modifications in the quark-gluon plasma. The results are compared to
  different models that incorporate either color coherence or medium response effects,
  where the two effects predict similar substructure modifications."
