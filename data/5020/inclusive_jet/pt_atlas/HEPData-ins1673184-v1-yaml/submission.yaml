additional_resources:
- {description: web page with auxiliary material, location: 'https://atlas.web.cern.ch/Atlas/GROUPS/PHYSICS/PAPERS/HION-2015-05/'}
comment: |
  CERN-LHC.  Measurements of the yield and nuclear modification factor, $R_{\mathrm {AA}}$, for inclusive jets are performed using $0.49$ nb$^{-1}$ of Pb+Pb data at $\sqrt{s_\mathrm{NN}} = 5.02$ TeV and 25 pb$^{-1}$ of pp data at $\sqrt{s}=5.02$ TeV. Jets are reconstructed with the anti-$k_{t}$ algorithm with radius parameter $R=0.4$ and are measured over the transverse momentum range of 50--1000 GeV in six rapidity intervals covering $|y|<2.8$. The magnitude of $R_{\mathrm {AA}}$ increases with increasing $p_{\mathrm {T}}$ reaching a value of $\approx 0.6$ near the $p_{\mathrm {T}}$ of 1 TeV in the most central collisions. The magnitude of the $R_{\mathrm {AA}}$ decreases towards increasingly peripheral collisions. The $R_{\mathrm {AA}}$ is independent of rapidity at low jet-$p_{\mathrm {T}}$ but it is observed to  decrease with increasing rapidity at high $p_{\mathrm {T}}$.
hepdata_doi: 10.17182/hepdata.84819.v1
record_ids:
- {id: 1511869, type: inspire}
