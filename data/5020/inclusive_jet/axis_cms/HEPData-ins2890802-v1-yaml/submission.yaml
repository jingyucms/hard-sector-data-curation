- {description: Webpage with all figures and tables, location: 'https://cms-results.web.cern.ch/cms-results/public-results/preliminary-results/HIN-24-010/index.html'}
comment: The jet axis decorrelation in inclusive jets is studied using lead-lead (PbPb)
  collisions at a center-of-mass energy per nucleon pair of 5.02 TeV. The jet axis
  decorrelation is defined as the angular difference between two definitions of the
  jet axis. It is obtained by applying two recombination schemes on all the constituents
  of a given jet reconstructed by the anti-$k_{\mathrm{T}}$ sequential algorithm with
  a distance parameter of $R = 0.4$. The data set, corresponding to an integrated
  luminosity of $0.662~\mathrm{nb}^{-1}$, was collected in 2018 with the CMS detector
  at the CERN LHC. The jet axis decorrelations are examined across collision centrality
  selections and intervals of jet transverse momentum. A centrality dependent evolution
  of the measured distributions is observed, with a progressive narrowing seen in
  more central events. This narrowing could result from medium-induced modification
  of the internal jet structure or reflect color charge effects in energy loss. This
  new measurement probes jet substructure in previously unexplored kinematic domains
  and show great promise for providing new insights on the color charge dependence
  of energy loss to jet-quenching models.
hepdata_doi: 10.17182/hepdata.156182.v1
