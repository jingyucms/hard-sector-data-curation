comment: |
  We present measurements of two-particle correlations with neutral pion trigger particles of transverse momenta $8 < p_{\mathrm{T}}^{\rm trig} < 16~\mathrm{GeV}/c$ and associated charged particles of $0.5 < p_{\mathrm{T}}^{\rm assoc} < 10~\mathrm{GeV}/c$ versus the azimuthal angle difference $\Delta\varphi$ at midrapidity in pp and central Pb-Pb collisions at $\sqrt{s_{\mathrm{NN}}}=2.76$ TeV with ALICE. The new measurements exploit associated charged hadrons down to $0.5~\mathrm{GeV}/c$, which significantly extends our previous measurement that only used charged hadrons above $3~\mathrm{GeV}/c$. After subtracting the contributions of the flow background, $v_2$ to $v_5$, the per-trigger yields are extracted for $|\Delta\varphi|<0.7$ on the near and for $|\Delta\varphi-\pi| < 1.1$ on the away side. The ratio of per-trigger yields in Pb-Pb to those in pp collisions, $I_{\mathrm{AA}}$, is measured on the near and away side for the $0$--$10$\% most central Pb-Pb collisions.
