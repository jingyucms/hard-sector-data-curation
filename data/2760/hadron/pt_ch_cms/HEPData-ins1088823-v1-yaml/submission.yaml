comment: |
  CERN-LHC.  Measurements of the transverse momentum spectra of charged particles produced in Lead-Lead nuclei collisions at a centre-of-mass energy per nucleon of 2.76 TeV. The measurements use data sets collected in  2010 and 2011 with respective integrated luminosities of 7 mub-1 and 150 mub-1, covering the PT range up to 100 GeV. A reference measurement  uses proton-proton data at centre-of-mass energy 2.76 TeV  collected in 2011 with integrated luminosity 230 nb-1. Particle yields and invariant differential spectra are presented in a variety of centrality ranges from 0-90%, together with the nuclear modification factor RAA and  the TAA-scaled ratios between central and peripheral centrality regions.
dateupdated: 30/05/2012 00:00:00
