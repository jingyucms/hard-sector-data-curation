additional_resources:
- {description: Link to the auxilliary information paper, location: 'https://atlas.web.cern.ch/Atlas/GROUPS/PHYSICS/PAPERS/HION-2011-02/'}
comment: |
  CERN-LHC. Measurements of the ratio, Rcp, between jet production in the central to peripheral regions in   Lead Lead collisions at a centre of mass energy/nucleon  of 2.76 TeV.  Jets are reconstructed with |eta|<2.1,  covering the jet PT range 38-210 GeV, using the   anti-Kt algorithm with norminal jet radii of R=0.2, 0.3, 0.4 and 0.5.  Seven regions of centrality are considered from   the most peripheral of 60-80% to the most central 0-10%. Rcp is studied as a function of jet PT, number of participating  nucleons NPART and R for each of the centrality regions, as well as the ratio of Rcp/Rcp(R=0.2) as a function of jet PT  for each R=0.3, 0.4 and 0.5.    Finally values of the covariance matrix for staistical correlations between jet PT bins are given.  In the tables the  first systematic errors are from JES, JER, efficiency, xin and Rcoll and are 100% correlated in PT.  The second  systematic errors are those that are partially correlated or uncorrelated in pt, taken to be 100% uncorrelated,  from the regularization parameter.
