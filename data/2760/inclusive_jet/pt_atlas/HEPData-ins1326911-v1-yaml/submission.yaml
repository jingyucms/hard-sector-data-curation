additional_resources:
- {description: web page with auxiliary material, location: 'http://atlas.web.cern.ch/Atlas/GROUPS/PHYSICS/PAPERS/HION-2013-06/'}
comment: |
  CERN-LHC. Measurements of inclusive jet production are performed in $pp$ and Pb+Pb collisions at $\sqrt{s_{\mathrm{NN}}}=2.76$ TeV with the ATLAS detector at the LHC, corresponding to integrated luminosities of 4.0 $\mathrm{pb}^{-1}$ and 0.14 $\mathrm{nb}^{-1}$ , respectively. The jets are identified with the anti-$k_t$ algorithm with $R=0.4$, and the spectra are measured over the kinematic range of jet transverse momentum $32 < p_{\mathrm{T}} < 500$ GeV, and absolute rapidity $|y| < 2.1$ and as a function of collision centrality. The nuclear modification factor, $R_{\mathrm{AA}}$, is evaluated and jets are found to be suppressed by approximately a factor of two in central collisions compared to $pp$ collisions. The $R_{\mathrm{AA}}$ shows a slight increase with $p_{\mathrm{T}}$ and no significant variation with rapidity.
dateupdated: 24/04/2015 07:16:36
hepdata_doi: 10.17182/hepdata.66021.v1
