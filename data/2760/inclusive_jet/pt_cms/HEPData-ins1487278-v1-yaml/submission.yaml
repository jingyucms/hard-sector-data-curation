  centrality bins) with the anti-k$_T$ algorythm with distance parameter $R=0.3$,
  in the range $70< p_{T} < 80$GeV/c and $|\eta|<2$. Quantity found by taking the
  difference of the sum of PF candidates within the jet cone and raw jet $p_T$.
