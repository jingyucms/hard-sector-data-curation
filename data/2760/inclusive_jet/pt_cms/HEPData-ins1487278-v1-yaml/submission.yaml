additional_resources:
- {description: web page with auxiliary material, location: 'https://cms-results.web.cern.ch/cms-results/public-results/publications/HIN-13-005/index.html'}
comment: "CERN-LHC. Inclusive jet spectra from pp and PbPb collisions at 2.76 TeV
  collected by the CMS experiment. Jets are reconstructed with three different distance
  parameters (R=0.2, 0.3, and 0.4) for transverse momentum pT>70GeV/c and pseudorapidity
  |eta|<2. The production cross sections and nuclear modification factor RAA is presented
  as function of pT and event centrality, for each R. \n"
hepdata_doi: 10.17182/hepdata.77601.v1
record_ids:
- {id: 1487278, type: inspire}
