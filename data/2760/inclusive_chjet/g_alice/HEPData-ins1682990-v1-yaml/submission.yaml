additional_resources: []
comment: "CERN-LHC.\r\nA set of jet shapes for a small resolution parameter $R = 0.2$
  was\r\nmeasured at mid-rapidity for $0$-$10\\%$ central Pb-Pb collisions at a centre-of-mass
  energy $\\sqrt{\\rm{s_{NN}}}$=2.76 TeV with the ALICE detector at the Large Hadron
  Collider (LHC).\r\nThis set of jet shapes includes the first radial moment or angularity,
  $g$; the momentum dispersion,\r\n $p_{\\rm T}D$; and the difference between the
  leading and sub-leading\r\n constituent track transverse momentum, $LeSub$. These
  observables provide complementary information on the\r\n jet fragmentation and can
  constrain different aspects of the theoretical description of jet-medium interactions.\r\n
  The measured jet shapes are compared with PYTHIA calculations."
hepdata_doi: 10.17182/hepdata.85738.v1
