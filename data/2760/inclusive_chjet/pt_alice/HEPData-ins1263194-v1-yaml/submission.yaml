  Nuclear modification factor, constructed as the ratio of jet pT spectra in central and peripheral collisions normalized by the nuclear overlap functions, as a function of the average number of participants in the collision (<Npart>), for charged jets with pT = 60-70 GeV and either R = 0.2 or R = 0.3 and a leading charged particle with pT > 0.15 GeV.  The correspondence between <Npart> and the centrality classes is given in Table 1 of the paper, and peripheral collisions are defined to have centrality 50-80%.
  The two systematic uncertainties correspond to the shape uncertainty and the correlated uncertainty.
