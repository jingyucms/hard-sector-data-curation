comment: |
  CERN-LHC.  Measurement of the transverse momentum spectra of jets in Pb-Pb collisions at sqrt(sNN) = 2.76TeV.  Jets are reconstructed from charged particles using the anti-kT jet algorithm with jet resolution parameters R of 0.2 and 0.3 in pseudo-rapidity |eta| < 0.5.  The transverse momentum pT of charged particles is measured down to 0.15 GeV which gives access to the low pT fragments of the jet.  A strong suppression of jet production in central events with respect to peripheral events is observed.
dateupdated: 17/04/2014 16:38:20
hepdata_doi: 10.17182/hepdata.62723.v1
modifications:
