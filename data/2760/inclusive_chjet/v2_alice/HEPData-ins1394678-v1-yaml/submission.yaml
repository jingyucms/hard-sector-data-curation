comment: "CERN-LHC.  \n\nWe present measurements of the azimuthal dependence of charged
  jet production in central and semi-central $\\sqrt{s}_{NN}$ = 2.76 TeV Pb--Pb collisions
  with respect to the second harmonic event plane, quantified as $v_2^{ch~jet}$. Jet
  finding is performed employing the anti-$k_{T}$ algorithm with a resolution parameter
  $R$ = 0.2 using charged tracks from the ALICE tracking system. The contribution
  of the azimuthal anisotropy of the underlying event is taken into account event-by-event.
  The remaining (statistical) region-to-region fluctuations are removed on an ensemble
  basis by unfolding the jet spectra for different event plane orientations independently.\n"
