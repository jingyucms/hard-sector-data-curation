comment: |
  Measurements of anisotropic flow coefficients with two- and multi-particle cumulants for inclusive charged particles in Pb--Pb collisions at $\sqrt{s_{\rm NN}} = 5.02$ and 2.76 TeV are reported in the pseudorapidity range $|\eta| < 0.8$ and transverse momentum $0.2 < p_\text{T} < 50$ GeV/$c$. The full data sample collected by the ALICE detector in 2015 (2010), corresponding to an integrated luminosity of 12.7 (2.0) $\mu$b$^{-1}$ in the centrality range 0-80$\%$, is analysed. Flow coefficients up to the sixth flow harmonic ($v_6$) are reported and a detailed comparison among results at the two energies is carried out. The $p_\text{T}$ dependence of anisotropic flow coefficients and its evolution with respect to centrality and harmonic number $n$ are investigated. An approximate power-law scaling of the form $v_n(p_\text{T}) \sim p_\text{T}^{n/3}$ is observed for all flow harmonics at low $p_\text{T}$ ($0.2 < p_\text{T} < 3$ GeV/$c$). At the same time, the ratios $v_n/v_m^{n/m}$ are observed to be essentially independent of $p_\text{T}$ for most centralities up to about $p_\text{T} = 10$ GeV/$c$. Analysing the differences among higher-order cumulants of elliptic flow ($v_2$), which have different sensitivities to flow fluctuations, a measurement of the standardised skewness of the event-by-event $v_2$ distribution $P(v_2)$ is reported and constraints on its higher moments are provided. The Elliptic Power distribution is used to parametrise $P(v_2)$, extracting its parameters from fits to cumulants. The measurements are compared to different model predictions in order to discriminate among initial-state models and to constrain the temperature dependence of the shear viscosity to entropy-density ratio.
