data_file: Table1.yaml
description: |
  Raw per trigger normalized yields of charged jets in the recoil region associated to a trigger hadron with pT (8,9) GeV/c. Recoil jets were reconstructed using the anti-kt algorithm with R=0.4 and track constituent cutoff pT>150 MeV/c. Jet pT was corrected for the underlying event activity using background density estimated in cones that were perpendicular in azimuth w.r.t. leading jet axis.  Statistical errors are given only.
