comment: "BNL-RHIC. We report high statistics measurements of inclusive charged hadron
  production in Au+Au and p+p collisions at \u221AsNN =200 GeV. A large, approximately
  constant hadron suppression is observed in central Au+Au collisions for 5<pT<12
  GeV/c. The collision energy dependence of the yields and the centrality and pT dependence
  of the suppression provide stringent constraints on theoretical models of suppression.
  Models incorporating initial-state gluon saturation or partonic energy loss in dense
  matter are largely consistent with observations. We observe no evidence of pT-dependent
  suppression, which may be expected from models incorporating jet attentuation in
  cold nuclear matter or scattering of fragmentation hadrons.\n"
hepdata_doi: 10.17182/hepdata.93908.v1
---
