additional_resources:
- {description: web page with all paper figures in eps/jpg format, location: 'https://drupal.star.bnl.gov/STAR/publications/measurement-inclusive-charged-particle-jet-production-auau-collisions-sqrtsnn-200-gev'}
comment: |
  BNL-RHIC.  The paper includes measurements of the charged-particle jet yields at midrapidity by the STAR experiment in Au+Au collisions at 200 GeV. The jets were reconstructed with the anti-kT algorithm for resolution parameter R=0.2, 0.3, and 0.4 in central (0-10%) and peripheral (60-80%) centrality using a low cut on transverse momentum of jet constituents (pT>0.2 GeV/c). To suppress the large combinatorial background a cut on pT of a leading particle in jet is imposed.  From the charged-particle jet yields nuclear modification factor R_AA and R_CP are calculated along with the spectra ratios at various R.
hepdata_doi: 10.17182/hepdata.95120.v1
